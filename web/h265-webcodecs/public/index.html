<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H.265 WebCodecs Viewer</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f4f5; --fg: #18181b; --card: #fff; --muted: #71717a; --bad: #dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111113; --fg: #e4e4e7; --card: #1c1c1f; --muted: #a1a1aa; --bad: #f87171; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  select, input, button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid #8884; background: var(--card); color: var(--fg); }
  input { width: 9em; }
  input[type=number] { width: 5em; }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--muted); }
  .form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .form label { display: flex; gap: 4px; align-items: center; color: var(--muted); }
  #log { color: var(--muted); font-size: 13px; margin-top: 8px; max-height: 8em; overflow: auto; }
  canvas { width: 100%; background: #000; border-radius: 8px; aspect-ratio: 16 / 9; display: block; }
  #stats { color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 8px; min-height: 1.4em; }
  #status { color: var(--muted); }
  #status.bad { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>GStreamer demo · H.265 via WebCodecs</h1>
  <div class="bar">
    <select id="channels"></select>
    <button id="remove" title="Remove this camera from the producer">Remove camera</button>
    <span id="status">loading…</span>
  </div>
  <canvas id="canvas" width="1280" height="720"></canvas>
  <div id="stats"></div>
  <details id="addpanel">
    <summary>Add a camera (producers with dynamic cameras, e.g. bevy-streamer)</summary>
    <div class="form">
      <label>name <input id="cam-name" placeholder="cctv1" pattern="[a-z0-9_]{1,24}"></label>
      <label>attach <select id="cam-attach"></select></label>
      <label>look at <select id="cam-look"></select></label>
      <label>size <select id="cam-size"><option>640x360</option><option>960x540</option><option>1280x720</option><option>512x512</option></select></label>
      <label>fps <select id="cam-fps"><option>30</option><option selected>15</option><option>10</option><option>5</option></select></label>
      <label>lifetime s <input id="cam-life" type="number" min="0" placeholder="∞"></label>
      <button id="cam-add">Add</button>
    </div>
  </details>
  <div id="log"></div>
</main>
<script>
// Receives the producer's original H.265 access units (Annex B) over a WebSocket and decodes
// them with the browser's VideoDecoder (GPU when available). Binary message layout:
//   [flags u8: bit0 = keyframe][timestamp µs float64 BE][H.265 Annex-B access unit]
// Text messages: {"type":"config","codec":"hev1.1.6.L120.90", "channel":{...}}
const $ = (id) => document.getElementById(id);
const canvas = $("canvas"), ctx = canvas.getContext("2d");
let ws, decoder, codec, waitKey = true;
let stat = { frames: 0, bytes: 0, dropped: 0, t0: performance.now(), fps: 0, kbps: 0 };

function status(text, bad = false) { $("status").textContent = text; $("status").className = bad ? "bad" : ""; }

function log(text) {
  const line = document.createElement("div");
  line.textContent = `${new Date().toLocaleTimeString()}  ${text}`;
  $("log").prepend(line);
}

/** (Re)load the channel list. Keeps the current channel if it still exists; reconnects only if needed. */
async function loadChannels() {
  const res = await fetch("/api/channels");
  const info = await res.json();
  if (!info.ok) { status(info.error, true); setTimeout(loadChannels, 2000); return; }
  const sel = $("channels");
  const current = sel.value || new URLSearchParams(location.search).get("channel");
  sel.innerHTML = "";
  for (const ch of info.channels)
    sel.add(new Option(`${ch.id} · ${ch.width}×${ch.height} @ ${ch.fps} · ${ch.bitrate_kbps} kbps`, ch.id));
  const still = info.channels.some((c) => c.id === current);
  if (still) sel.value = current;
  $("remove").disabled = sel.value === "mosaic";
  if (!still || !ws || ws.readyState > 1) { codec = null; connect(); }
}

// channel list changes pushed by the producer (via the relay)
const events = new EventSource("/api/events");
events.onmessage = (e) => {
  const ev = JSON.parse(e.data);
  if (ev.event === "channel_added") log(`+ ${ev.channel.id} added (${ev.channel.width}×${ev.channel.height} @ ${ev.channel.fps})`);
  if (ev.event === "channel_removed") log(`− ${ev.id} removed`);
  if (ev.event) loadChannels().catch(() => {});
};

// add / remove camera form
const anchors = ["world", "ego", ...[...Array(12).keys()].map((i) => `car:${i}`), ...[...Array(6).keys()].map((i) => `drone:${i}`)];
for (const a of anchors) $("cam-attach").add(new Option(a));
for (const a of ["(default)", "forward", ...anchors.filter((a) => a !== "world")]) $("cam-look").add(new Option(a));
$("cam-add").onclick = async () => {
  const [width, height] = $("cam-size").value.split("x").map(Number);
  const body = { name: $("cam-name").value.trim(), attach: $("cam-attach").value, width, height, fps: Number($("cam-fps").value) };
  if ($("cam-look").value !== "(default)") body.look_at = $("cam-look").value;
  if ($("cam-life").value) body.lifetime = Number($("cam-life").value);
  const r = await (await fetch("/api/cameras", { method: "POST", body: JSON.stringify(body) })).json();
  log(r.ok ? `added ${r.channel.id} on port ${r.channel.port}` : `add failed: ${r.error}`);
  if (r.ok) { $("cam-name").value = ""; $("channels").value = r.channel.id; }
};
$("remove").onclick = async () => {
  const id = $("channels").value;
  if (!id || id === "mosaic" || !confirm(`Remove camera ${id} from the producer?`)) return;
  const r = await (await fetch(`/api/cameras/${encodeURIComponent(id)}`, { method: "DELETE" })).json();
  log(r.ok ? `removed ${id}` : `remove failed: ${r.error}`);
};

function makeDecoder() {
  decoder?.state !== "closed" && decoder?.close();
  decoder = new VideoDecoder({
    output: (frame) => {
      if (canvas.width !== frame.displayWidth || canvas.height !== frame.displayHeight) {
        canvas.width = frame.displayWidth; canvas.height = frame.displayHeight;
      }
      ctx.drawImage(frame, 0, 0);
      frame.close();
      stat.frames++;
    },
    error: (e) => { status("decoder error: " + e.message, true); waitKey = true; setTimeout(() => configure(codec), 0); },
  });
}

async function configure(c) {
  codec = c;
  const config = { codec, hardwareAcceleration: "prefer-hardware", optimizeForLatency: true };
  let { supported } = await VideoDecoder.isConfigSupported(config);
  if (!supported) {   // some browsers only decode HEVC in software or vice versa
    config.hardwareAcceleration = "no-preference";
    ({ supported } = await VideoDecoder.isConfigSupported(config));
  }
  if (!supported) { status(`This browser cannot decode ${codec} (H.265). Try Chrome/Edge with a GPU that supports HEVC, or Safari.`, true); return false; }
  makeDecoder();
  decoder.configure(config); // no "description" -> bitstream is Annex B with in-band VPS/SPS/PPS
  waitKey = true;
  status(`decoding ${codec}`);
  return true;
}

function connect() {
  ws?.close();
  const ch = $("channels").value;
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${scheme}://${location.host}/ws?channel=${encodeURIComponent(ch)}`);
  ws.binaryType = "arraybuffer";
  status(`connecting to ${ch}…`);
  ws.onclose = (ev) => { if (ev.target === ws) { status("connection lost, retrying…", true); setTimeout(connect, 2000); } };
  ws.onmessage = async (ev) => {
    if (typeof ev.data === "string") {
      const msg = JSON.parse(ev.data);
      if (msg.type === "gone") { status(`channel ${msg.id} was removed`, true); $("channels").value = ""; return; }
      if (msg.type === "config" && msg.codec !== codec) await configure(msg.codec);
      return;
    }
    stat.bytes += ev.data.byteLength;
    if (!decoder || decoder.state !== "configured") return;
    const view = new DataView(ev.data);
    const key = (view.getUint8(0) & 1) === 1;
    if (waitKey && !key) return;
    // falling behind (slow decoder or tab in background): skip to the next keyframe
    if (decoder.decodeQueueSize > 8 && !key) { waitKey = true; stat.dropped++; return; }
    waitKey = false;
    decoder.decode(new EncodedVideoChunk({
      type: key ? "key" : "delta",
      timestamp: view.getFloat64(1),
      data: new Uint8Array(ev.data, 9),
    }));
  };
}

setInterval(() => {
  const now = performance.now(), dt = (now - stat.t0) / 1000;
  stat.fps = stat.frames / dt; stat.kbps = (stat.bytes * 8) / 1000 / dt;
  $("stats").textContent = `${codec ?? "?"} · ${canvas.width}×${canvas.height} · ${stat.fps.toFixed(1)} fps · ` +
    `${stat.kbps.toFixed(0)} kbps · decode queue ${decoder?.decodeQueueSize ?? 0} · skipped ${stat.dropped}`;
  stat = { ...stat, frames: 0, bytes: 0, t0: now };
}, 1000);

$("channels").onchange = () => {
  $("remove").disabled = $("channels").value === "mosaic";
  const url = new URL(location); url.searchParams.set("channel", $("channels").value); history.replaceState(null, "", url);
  codec = null; connect();
};

if (!("VideoDecoder" in window)) {
  status(window.isSecureContext ? "This browser has no WebCodecs support." :
    "WebCodecs needs a secure context: open via http://localhost or start the server with --https.", true);
} else {
  loadChannels().catch((e) => status(e.message, true));
}
</script>
</body>
</html>
