[package]
name = "gst-demo"
version = "0.1.0"
edition = "2024"
description = "GStreamer H.265 producer / receiver demo (Rust port of the Python scripts)"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
gst = { package = "gstreamer", version = "0.25" }
gst-app = { package = "gstreamer-app", version = "0.25" }
gst-video = { package = "gstreamer-video", version = "0.25" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
members = [".", "sim-streamer", "bevy-streamer"]
default-members = [".", "sim-streamer"]

# Bevy compiles much faster with optimized dependencies even in dev builds
[profile.dev.package."*"]
opt-level = 2
